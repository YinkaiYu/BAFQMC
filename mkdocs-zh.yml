site_name: BAFQMC（简体中文）
site_description: 玻色辅助场量子蒙特卡洛——从局域正性到全局对称性
site_url: https://www.yykspace.com/BAFQMC/zh/
repo_url: https://github.com/YinkaiYu/BAFQMC
repo_name: YinkaiYu/BAFQMC
edit_uri: blob/main/docs/zh/
docs_dir: .build/docs-zh-source
site_dir: .build/site/zh
theme:
  name: material
  language: zh
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - scheme: default
      primary: teal
      accent: light blue
      toggle:
        icon: material/weather-night
        name: 切换至深色模式
    - scheme: slate
      primary: teal
      accent: light blue
      toggle:
        icon: material/weather-sunny
        name: 切换至浅色模式
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
extra:
  alternate:
    - name: English
      link: /BAFQMC/
      lang: en
    - name: 简体中文
      link: /BAFQMC/zh/
      lang: zh
plugins:
  - search:
      lang: [zh, en]
markdown_extensions:
  - toc:
      slugify: !!python/name:markdown.extensions.toc.slugify_unicode
  - tables
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
extra_javascript:
  - assets/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
nav:
  - 概述:
      - BAFQMC: index.md
      - 算法与约定: algorithm.md
      - 物理观测量: observables.md
  - 计算:
      - 开始使用: getting-started.md
      - 科研工作流: agent-workflows.md
      - 粒子数守恒求解器: solver-number-conserving.md
      - 配对求解器: solver-pairing.md
  - 复现:
      - Benchmark 与数据: benchmarks-paper-readme.md
      - 计算资源: benchmarks-paper-resources.md
      - 验证记录: benchmarks-paper-validation.md
  - 开发:
      - Agent 指令: agents.md
      - 开发与验证: development.md
      - 新物理模型: model-development.md
      - 科学测试: testing.md
      - 参与贡献: contributing.md
      - 版本发布: releases.md
      - 更新日志: changelog.md
      - 社区准则: code-of-conduct.md
      - 安全报告: security.md
validation:
  links:
    not_found: warn
    unrecognized_links: warn
